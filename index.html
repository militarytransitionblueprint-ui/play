<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Return to Base Solutions — apps</title>
<link rel="icon" href="favicon.png">
<style>
  :root { --navy:#0A1433; --navy2:#13214d; --red:#C8102E; --white:#f5f7fb; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--navy); color:var(--white); display:flex; flex-direction:column; align-items:center; }
  header { width:100%; border-bottom:4px solid var(--red); padding:28px 20px; text-align:center; }
  h1 { margin:0; font-size:clamp(1.6rem,4vw,2.4rem); letter-spacing:.02em; }
  h1 span { color:var(--red); }
  p.sub { margin:.5rem 0 0; opacity:.8; }
  main { width:100%; max-width:760px; padding:32px 20px; display:grid; gap:18px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); }
  a.card { display:block; text-decoration:none; color:inherit; background:var(--navy2); border:1px solid #2a3a6e; border-left:6px solid var(--red); border-radius:12px; padding:22px; transition:transform .15s, border-color .15s; }
  a.card:hover, a.card:focus { transform:translateY(-2px); border-color:var(--red); outline:none; }
  a.card h2 { margin:0 0 .4rem; font-size:1.3rem; }
  a.card p { margin:0; opacity:.8; line-height:1.4; }
  footer { margin-top:auto; padding:20px; font-size:.85rem; opacity:.6; }
</style>
</head>
<body>
<header>
  <h1>Return to Base <span>Solutions</span></h1>
  <p class="sub">Apps</p>
</header>
<main>
  <a class="card" href="cubernova/"><h2>Cubernova</h2><p>A 3D cube match puzzle game. Play in your browser.</p></a>
  <a class="card" href="blueprint/"><h2>Transition Blueprint</h2><p>Your military transition, step by step.</p></a>
</main>
<footer>&copy; Return to Base Solutions</footer>
</body>
</html>
